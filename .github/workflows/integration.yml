name: Integration

# 真库集成门禁（PG + Redis）：跑 AGENTS.md 与 ci.yml 末尾注释里那份配方。
# 触发面：① 改动 go/** 的 PR；② 每夜 cron；③ 手动。
# 为什么按 paths 收窄到 go/**：集成用例全是 Go 侧（PG/Redis 语义），前端或文档改动不该付这份代价。
# 代价：改了 go/** 的 PR 会多一次真库作业（服务容器启动 + 迁移建表 + 全量 go test，比纯单测慢数分钟）；
# 同一 ref 的旧作业由下面的 concurrency 取消，连推不会堆叠。仍嫌慢就把它改回「仅 cron + main」，
# 判据是「改 go/** 的 PR 数 × 该作业时长」是否超过这份真库语义的漏检成本。
on:
  schedule:
    # 每日 18:00 UTC（= 次日 02:00 CST），避开 CI 白天的排队峰值。
    - cron: "0 18 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "go/**"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-integration:
    name: Go（真库集成：PG + Redis）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cch
          POSTGRES_PASSWORD: cch
          POSTGRES_DB: cch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cch" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: 迁移建表
        # 集成用例**自身不建 schema**（见 ci.yml 注释第 ① 条）：先跑一次 cchd 让
        # AUTO_MIGRATE 把 drizzle 迁移逐条应用上，再跑测试。日志出现 migration_applied /
        # migration_up_to_date 即视为 schema 就位；cchd 只在需要建表时被拉起，随即关掉。
        # CCH_EGRESS_PAGES=off：不装配 UI 静态面，故无需先 bun run build 出嵌入产物。
        working-directory: go
        env:
          DSN: postgres://cch:cch@127.0.0.1:5432/cch_test
          REDIS_URL: redis://127.0.0.1:6379/15
          AUTO_MIGRATE: "true"
          CCH_EGRESS_PAGES: "off"
          PORT: "18080"
        run: |
          go run ./cmd/cchd > /tmp/cchd-migrate.log 2>&1 &
          cchd_pid=$!
          for _ in $(seq 1 90); do
            if grep -Eq "migration_applied|migration_up_to_date" /tmp/cchd-migrate.log; then break; fi
            if ! kill -0 "$cchd_pid" 2>/dev/null; then
              echo "::error::cchd 在迁移完成前退出"
              cat /tmp/cchd-migrate.log
              exit 1
            fi
            sleep 1
          done
          grep -Eq "migration_applied|migration_up_to_date" /tmp/cchd-migrate.log || {
            echo "::error::90s 内未见迁移完成日志"
            cat /tmp/cchd-migrate.log
            exit 1
          }
          kill "$cchd_pid" 2>/dev/null || true
          wait "$cchd_pid" 2>/dev/null || true
          cat /tmp/cchd-migrate.log

      - name: 集成测试
        # 注入 DSN / Redis 后，真库集成用例整组启用（未注入时它们会自行跳过）。
        # Redis 用独立 db（/15）避免与其它用例互相刷键。
        working-directory: go
        env:
          CCH_TEST_DSN: postgres://cch:cch@127.0.0.1:5432/cch_test
          CCH_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: go test -timeout 600s ./...
