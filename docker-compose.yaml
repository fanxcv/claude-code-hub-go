name: ${COMPOSE_PROJECT_NAME:-claude-code-hub-go}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # 不对外暴露数据库端口，仅允许容器内部网络访问
    # 如需调试，可取消注释下行（仅绑定本机）：
    # ports:
    #   - "127.0.0.1:35432:5432"
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-claude_code_hub}
      # 使用自定义数据目录
      PGDATA: /data/pgdata
      # 设置时区为上海
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      # 持久化数据库数据到本地 ./data/postgres 目录
      # 挂载到 /data 而不是 /var/lib/postgresql/data 避免权限冲突
      - ./data/postgres:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-claude_code_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      # 持久化 Redis 数据到本地 ./data/redis 目录
      # 使用 AOF 持久化模式,确保数据不丢失
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    # Go 单进程后端（数据面 + 管理面 + 内嵌 UI）。
    # 也可指向 ghcr.io/fanxcv/claude-code-hub-go:latest，或本地构建的镜像（见 README「从源码构建」）。
    image: ${CCH_IMAGE:-docker.io/fanxcv/claude-code-hub-go:latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      # 容器内使用镜像默认端口 23000，对外通过 APP_PORT 暴露（默认 23000）。
      # 注意：容器内端口由 PORT 决定，改 PORT 时这里的映射右侧要一起改。
      DSN: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-claude_code_hub}
      REDIS_URL: redis://redis:6379
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      SESSION_TTL: ${SESSION_TTL:-300}
      DB_POOL_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT:-20}
      DB_POOL_CONNECT_TIMEOUT: ${DB_POOL_CONNECT_TIMEOUT:-10}
      # 页面面归属：embed = 由二进制的内嵌 UI 产物作答（镜像已默认 embed，这里显式写出便于阅读）。
      CCH_EGRESS_PAGES: ${CCH_EGRESS_PAGES:-embed}
      # 设置时区为上海
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-23000}:23000"
    restart: unless-stopped
    # 健康检查由镜像自带的 HEALTHCHECK 提供（探 /readyz：PG、Redis、规则快照、排空状态）
    # 如需限制资源，可选用下面两行（Go 版实测：闲置约 92 MiB，50 条并发 8 MiB 流峰值增量约 53 MiB）：
    # mem_limit: 512m
    # mem_reservation: 256m
